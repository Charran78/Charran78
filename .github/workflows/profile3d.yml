name: Profile 3D Contributions

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

# Permisos explícitos para el token automático
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D contributions (Minecraft style)
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Token automático
          USERNAME: ${{ github.repository_owner }}
          TARGET: profile-gitblock                     # Solo estilo Minecraft (opcional)

      # Depuración: listar archivos generados
      - name: List generated files
        run: ls -la profile-3d-contrib/ || echo "No se generó la carpeta"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update 3D contributions"
          file_pattern: "profile-3d-contrib/"
          commit_options: "--no-verify"
          push_options: "--force-with-lease"
